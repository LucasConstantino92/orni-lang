name: Validate

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  validate:
    name: Compiler and editor (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install Rust components
        run: |
          rustup target add wasm32-wasip1
          rustup component add clippy rustfmt
      - run: npm ci --prefix editors/vscode
      - run: node tools/verify-versions.mjs
      - run: cargo fmt --all --check
      - run: cargo test --locked --target wasm32-wasip1
      - run: cargo clippy --locked --all-targets --target wasm32-wasip1 -- -D warnings
      - run: cargo build --locked --target wasm32-wasip1
      - run: node --test tools/cli.test.mjs
      - run: npm test --prefix editors/vscode
      - run: node tools/package-editor.mjs
      - name: Package and verify standalone extension
        working-directory: editors/vscode
        run: |
          npx --no-install vsce package --allow-missing-repository --out orni-language-test.vsix
          node ../../tools/verify-vsix.mjs orni-language-test.vsix
      - name: Test the real extension host (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:host --prefix editors/vscode
      - name: Test the real extension host (Windows)
        if: runner.os == 'Windows'
        run: npm run test:host --prefix editors/vscode
