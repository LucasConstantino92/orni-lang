name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify-package-release:
    name: Verify, package, and release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a semantic version tag such as v0.7.5, received: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Check out tagged source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-wasip1
          rustup component add clippy

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Run Rust tests
        run: cargo test --target wasm32-wasip1

      - name: Run Rust lints
        run: cargo clippy --all-targets --target wasm32-wasip1 -- -D warnings

      - name: Run editor tests
        run: node --test editors/vscode/test/language-support.test.js

      - name: Package editor extension
        working-directory: editors/vscode
        run: npx --yes @vscode/vsce package --allow-missing-repository

      - name: Locate packaged extension
        id: package
        shell: bash
        run: |
          vsix_path=$(find editors/vscode -maxdepth 1 -name 'orni-language-*.vsix' -print -quit)
          if [[ -z "$vsix_path" ]]; then
            echo "The VSIX package was not created." >&2
            exit 1
          fi
          echo "vsix_path=$vsix_path" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VSIX_PATH: ${{ steps.package.outputs.vsix_path }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$VSIX_PATH" --clobber
          else
            gh release create "$RELEASE_TAG" "$VSIX_PATH" \
              --verify-tag \
              --generate-notes \
              --title "Orni $RELEASE_TAG"
          fi
