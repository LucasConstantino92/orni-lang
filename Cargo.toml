[package]
name = "orni"
version = "0.9.3"
edition = "2024"
description = "A memory-conscious framework and language for predictable server applications."
license = "MIT"
repository = "https://github.com/LucasConstantino92/orni-lang"
readme = "README.md"

[dependencies]
toml_edit = { version = "0.22.27", default-features = false, features = ["parse"] }
uuid = { version = "1.0", default-features = false, features = ["std", "v4"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
hmac = { version = "0.12", default-features = false }
sha2 = { version = "0.10", default-features = false }

[lints.rust]
unsafe_code = "forbid"
